name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test source
        run: |
          python -m pip install pytest
          python -m pip install .
          python -m pytest -q
      - name: Verify installed console command
        run: python acceptance.py
      - name: Fresh non-editable install
        shell: bash
        run: |
          python -m venv .fresh-venv
          if [ "${{ runner.os }}" = "Windows" ]; then
            .fresh-venv/Scripts/python -m pip install .
            .fresh-venv/Scripts/python acceptance.py
          else
            .fresh-venv/bin/python -m pip install .
            .fresh-venv/bin/python acceptance.py
          fi
